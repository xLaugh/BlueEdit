[package]
name = "blue-edit"
version = "0.1.0"
edition = "2021"
description = "Logiciel de montage vidéo à pistes (Windows, macOS, Linux)"
license = "GPL-3.0-only"
repository = "https://github.com/xLaugh/BlueEdit"
authors = ["xLaugh"]

[[bin]]
name = "blue"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.15"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
ureq = { version = "2", features = ["json"] }
egui_dock = { version = "0.16", features = ["serde"] }
roxmltree = "0.20"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
